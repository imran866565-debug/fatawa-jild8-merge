name: Merge Jild 8 tashreeh
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge chunks
        run: python3 merge_jild8.py
      - name: Verify merged file
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('jild-08.json', encoding='utf-8'))
          items = d['masail']
          pages = set()
          for it in items:
              pages.update(it['pages'])
          print('items:', len(items))
          print('unique pages:', len(pages), 'min:', min(pages), 'max:', max(pages))
          print('ids unique:', len(set(it['id'] for it in items)) == len(items))
          print('empty jawab:', sum(1 for it in items if not it.get('tashreeh_jawab')))
          print('with sawal:', sum(1 for it in items if it.get('tashreeh_sawal')))
          print('volume_ids:', sorted(set(it.get('volume_id') for it in items)))
          print('start_page==min(pages) all:', all(it.get('start_page') == min(it['pages']) for it in items))
          print('has jild8-masala-1163-p109:', any(it['id'] == 'jild8-masala-1163-p109' for it in items))
          assert len(items) == 367
          assert len(pages) == 619
          assert len(set(it['id'] for it in items)) == len(items)
          assert all(it.get('tashreeh_jawab') for it in items)
          print('VERIFICATION PASSED')
          EOF
      - name: Create release with merged file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la jild-08.json
          gh release create v1.0 jild-08.json --title "Jild 8 tashreeh - merged" --notes "Merged tashreeh for Fatawa Razviya Jild 8: 367 items, 619 pages (volume_id 48). Generated by merge_jild8.py from the 13 chunk files." || gh release upload v1.0 jild-08.json --clobber
